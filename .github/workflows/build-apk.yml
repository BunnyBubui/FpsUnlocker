name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      # ถ้า build พัง ส่งบรรทัด error ออกมาเป็น annotation ให้อ่านได้จากหน้า Actions
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FpsUnlocker-apk
          path: app/build/outputs/apk/debug/*.apk

      # ทำ Release เพื่อให้ดาวน์โหลด APK บนมือถือได้ตรงๆ ไม่ต้องแตก zip
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FpsUnlocker.apk
          gh release create "build-${{ github.run_number }}" FpsUnlocker.apk \
            --title "FPS Unlocker build ${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}" \
            --latest
