name: Build APK

on:
  push:
    # แก้แค่เอกสารไม่ต้อง build ใหม่
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      # ถ้า build พัง ส่งบรรทัด error ออกมาเป็น annotation ให้อ่านได้จากหน้า Actions
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FpsUnlocker-apk
          path: app/build/outputs/apk/debug/*.apk

      # ทำ Release เพื่อให้ดาวน์โหลด APK บนมือถือได้ตรงๆ ไม่ต้องแตก zip
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk FpsUnlocker.apk
          git log -1 --pretty=%B > commit.txt
          {
            echo "## FPS Unlocker v${VERSION} (build ${{ github.run_number }})"
            echo
            echo "**Install / ติดตั้ง:** download \`FpsUnlocker.apk\` below and open it. It installs over older builds. / ดาวน์โหลด \`FpsUnlocker.apk\` ด้านล่างแล้วเปิดติดตั้ง ติดตั้งทับเวอร์ชันเก่าได้"
            echo
            echo "Requires Android 11+ and [Shizuku](https://shizuku.rikka.app/). / ต้องใช้ Android 11 ขึ้นไปและแอป Shizuku"
            echo
            echo "### Changes / สิ่งที่เปลี่ยน"
            echo
            sed '/^Co-Authored-By/d;/^Claude-Session/d' commit.txt
          } > notes.md
          gh release create "$TAG" FpsUnlocker.apk \
            --title "FPS Unlocker v${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
