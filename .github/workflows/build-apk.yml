name: Build APK

on:
  push:
    # แก้แค่เอกสารไม่ต้อง build ใหม่
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      # ถ้า build พัง ส่งบรรทัด error ออกมาเป็น annotation ให้อ่านได้จากหน้า Actions
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FpsUnlocker-apk
          path: app/build/outputs/apk/debug/*.apk

      # Debug artifacts are for testing. Distribution builds require a private signing key.
